services:
  postgres:
    image: postgres:16-alpine
    container_name: gym_postgres
    restart: always
    environment:
      POSTGRES_DB: gymdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5438}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gymdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  gym-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gym_management_api
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=gymdb;Username=postgres;Password=postgres"
      Jwt__SecretKey: "SuperSecretKeyForGymManagementApiExamTesting12345!"
      Jwt__Issuer: "GymManagementApi"
      Jwt__Audience: "GymManagementApi"
      Jwt__ExpiryMinutes: "120"
    ports:
      - "${API_PORT:-5100}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
